<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Console Admin - Nomad Pi</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-8 text-blue-400 border-b border-slate-700 pb-4">Gestion des élèves</h1>
        
        <div id="liste-eleves" class="grid gap-4">
            <p class="text-slate-500 italic">Chargement des élèves...</p>
        </div>
    </div>

    <script>
        async function chargerEleves() {
            const resp = await fetch('/api/eleves');
            const eleves = await resp.json();
            const liste = document.getElementById('liste-eleves');
            liste.innerHTML = '';
            
            if (eleves.length === 0) {
                liste.innerHTML = '<p class="text-slate-500">Aucun élève inscrit pour le moment.</p>';
                return;
            }

            eleves.forEach(e => {
                liste.innerHTML += `
                    <div class="flex justify-between items-center bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-lg">
                        <div>
                            <p class="text-xl font-bold text-white">${e.pseudo} <span class="text-sm font-normal text-slate-400">(${e.classe})</span></p>
                            <p class="text-sm text-blue-400">${e.email}</p>
                            <p class="text-xs text-slate-500 mt-1 italic">${e.etablissement || 'Établissement non précisé'}</p>
                        </div>
                        <button onclick="supprimer('${e.email}')" class="bg-red-500 hover:bg-red-600 text-white font-bold px-4 py-2 rounded-xl transition-all active:scale-95">
                            Supprimer
                        </button>
                    </div>`;
            });
        }

        async function supprimer(email) {
            if(confirm("Es-tu sûr de vouloir supprimer cet élève ?")) {
                const formData = new FormData();
                formData.append('email', email);
                await fetch('/api/delete_eleve', { method: 'POST', body: formData });
                chargerEleves(); // Actualise la liste
            }
        }

        // Charger la liste au démarrage
        chargerEleves();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-[#F8F9FD] p-6 font-[Poppins]">
    <h1 class="text-2xl font-bold mb-6 text-gray-800">Paramètres</h1>
    
    <div class="space-y-4">
        <div class="bg-white p-5 rounded-3xl shadow-sm flex justify-between items-center">
            <div class="flex items-center gap-4 text-gray-700">
                <i class="fas fa-wifi text-blue-500"></i>
                <span class="font-bold">Mode Hors-Ligne</span>
            </div>
            <div class="w-10 h-6 bg-green-500 rounded-full relative"><div class="absolute right-1 top-1 w-4 h-4 bg-white rounded-full"></div></div>
        </div>

        <div class="bg-white p-5 rounded-3xl shadow-sm flex justify-between items-center">
            <div class="flex items-center gap-4 text-gray-700">
                <i class="fas fa-moon text-purple-500"></i>
                <span class="font-bold">Mode Sombre</span>
            </div>
            <div class="w-10 h-6 bg-gray-200 rounded-full relative"><div class="absolute left-1 top-1 w-4 h-4 bg-white rounded-full"></div></div>
        </div>

        <div class="bg-white p-5 rounded-3xl shadow-sm border border-red-100">
            <div class="flex items-center gap-4 text-red-500">
                <i class="fas fa-trash"></i>
                <span class="font-bold">Effacer les données</span>
            </div>
        </div>
    </div>

    <a href="/" class="mt-10 block text-center text-blue-600 font-bold bg-blue-50 py-4 rounded-2xl">Retour à l'accueil</a>
</body>
</html>
